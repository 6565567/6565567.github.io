<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pizza Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="pizza-theme">
<header class="pizza-hero">
    <div class="container">
        <h1>🍕 Pizza Manager</h1>
        <p>CRUD aplikacja dla modelu Pizza</p>
    </div>
</header>
<nav class="pizza-info-bar">
    <div class="container">
        Zarządzanie menu restauracji PizzaCorpUnited
    </div>
</nav>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="pizza-footer">
    <div class="container">
        @PizzaCorpUnited
    </div>
</footer>
</body>
</html>
